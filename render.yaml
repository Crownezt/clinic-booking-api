services:
  - type: web
    name: clinic-booking-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString
      - key: API_KEY
        generateValue: true

databases:
  - name: clinic-booking-db
    databaseName: clinic_booking
    user: clinic_user